    <section class="hero">
      <div class="stage">

          Sorry, your browser doesn't support embedded videos.

    <section class="bento-row" aria-label="Features">
      <article class="card settings-card">
        <div class="shot-wrap">
          <img src="./assets/app-settings.jpg" alt="macTilt settings window showing tilt thresholds, display and physics controls" loading="lazy">
        </div>

        <p>Thresholds, display source, physics, shaders and live preview — dial it in exactly how you like it.</p>

      </article>
    </section>

  <script>
    document.getElementById('download-release').addEventListener('click', async (e) => {
      e.preventDefault();
      const fallback = 'https://github.com/lqSky7/iphone-duo-macos-animation/releases/latest';
      try {
        const res = await fetch('https://api.github.com/repos/lqSky7/iphone-duo-macos-animation/releases/latest');
        if (!res.ok) throw 0;
        const data = await res.json();
        const assets = data.assets || [];
        const dmg = assets.find(a => /\.dmg$/i.test(a.name)) || assets[0];
        window.location.href = (dmg && dmg.browser_download_url) || fallback;
      } catch {
        window.location.href = fallback;
      }
    });
  </script>
